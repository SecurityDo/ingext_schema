---
note: "All metrics are monotonic counters; use rate()/increase() over a time window, never the raw
  value."
description: The stream fabric component metrics.

flow: >
  Data flows through the platform as datasource -> router -> datasink. Each router
  contains at least one pipe, which handles the processing and directs the data to a
  sink. So a single logical path is: datasource (src_*) -> router (rt_*, containing one
  or more pipes pipe_*) -> datasink (sink_*).

server: VictoriaMetrics

queryLanguage: 
  - PromQL
  - MetricsQL

counters:
  - name: platform_component_total
    description: component event count
  - name: platform_component_bytes
    description: component byte count

labels:

  - name: component
    description: stream fabric component type
    samples:  ["datasource", "router", "pipe", "datasink"]
  - name: action
    description: >
      stream action. "input" is the data received by the source or router. "pass" is data
      passed through (e.g. forwarded by a router/pipe). "output" is data emitted by a
      component (e.g. written out by a datasink). "compressed" is the compressed (on-wire)
      byte count at a sink. "error" / "drop" / "ignore" are events that errored, were
      dropped, or were ignored.
    samples: ["input", "output", "pass", "error", "drop", "ignore", "compressed"]
  - name: id
    description: component ID
    samples: ["src_*", "sink_*", "rt_*", "pipe-*"]
  - name: application
    description: application name
    samples: ["Office365", "GSuite"]
  - name: appInstance
    description: application instance name
    samples: ["Office365-default", "GSuite-default"]

examples:
  - description: Events per second by component type and action, last 5 minutes.
    query: |
      sum by (component, action) (rate(platform_component_total[5m]))
  - description: Dropped and errored events per second by component ID.
    query: |
      sum by (id) (rate(platform_component_total{action=~"error|drop"}[5m]))
  - description: Total bytes received by all datasources over the last hour (ingress volume / health check).
    query: |
      sum (increase(platform_component_bytes{component="datasource", action="input"}[1h]))
  - description: Ingress bytes per source application over the last hour (top sources).
    query: |
      sum by (application) (increase(platform_component_bytes{component="datasource", action="input"}[1h]))
  - description: Per-datasource ingest rate trend (for spike / outage anomaly detection).
    query: |
      sum by (application) (rate(platform_component_bytes{component="datasource", action="input"}[1h]))
  - description: Top talker datasources by ingress volume over the last hour.
    query: |
      topk(5, sum by (id, application) (increase(platform_component_bytes{component="datasource", action="input"}[1h])))
  - description: Router processing errors by router over the last hour (0 = healthy).
    query: |
      sum by (id, application) (increase(platform_component_total{component="router", action="error"}[1h]))
  - description: Events dropped at routers and sinks by component over the last hour.
    query: |
      sum by (component, id, application) (increase(platform_component_total{component=~"router|datasink", action="drop"}[1h]))
