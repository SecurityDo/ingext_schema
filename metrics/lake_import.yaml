---
note: "All metrics are monotonic counters; use rate()/increase() over a time window, never the raw
  value."
description: datalake input metrics


server: VictoriaMetrics

queryLanguage: 
  - PromQL
  - MetricsQL

counters:
  - name: lake_import_count
    description: datalake input event count 
  - name: lake_import_bytes
    description: datalake input event byte count

labels:
  - name: account
    description: account name
  - name: index
    description: datalake index full name "$datalake-$index"
    samples: ["managed-Office365"]
  - name: eventType
    description: event type

examples:
  - description: Imported events per second by event type, last 5 minutes.
    query: |
      sum by (eventType) (rate(lake_import_count[5m]))
  - description: Total bytes imported per datalake index over the last hour.
    query: |
      sum by (index) (increase(lake_import_bytes[1h]))